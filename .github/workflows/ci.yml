name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scala-tests:
    name: Scala build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: sbt formatting check
        run: sbt scalafmtCheckAll

      - name: sbt test & package
        run: sbt test package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: spark-asammdf-jar
          path: target/scala-2.13/spark-asammdf-scala_2.13-0.1.jar

  python-tests:
    name: Python tests
    needs: scala-tests
    runs-on: ubuntu-latest
    env:
      # Exercise the Python source directly in this job. Installing the package
      # first builds Cython extensions in-place; Python would then prefer the
      # generated .so files and coverage.py would incorrectly report helper.py
      # and bridge.py as unexecuted.
      PYTHONPATH: ${{ github.workspace }}/src/main/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: spark-asammdf-jar
          path: target/scala-2.13/

      - name: Install Python runtime and test dependencies
        run: |
          pip install "pyspark>=4.0.0" asammdf pyarrow pandas numpy
          pip install -r src/test/python/requirements.txt
          pip install pytest-cov

      - name: Generate synthetic test fixture
        run: python src/test/resources/generate_fixture.py

      - name: Run Python test suite with source coverage
        run: |
          python -m pytest src/test/python -v \
            --cov=mdf_spark \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  notebook:
    name: End-to-end notebook
    needs: scala-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: spark-asammdf-jar
          path: target/scala-2.13/

      - name: Install connector and notebook dependencies
        run: |
          pip install -e .
          pip install jupyter nbclient nbformat plotly kaleido

      - name: Generate synthetic MDF4 fixture
        run: python src/test/resources/generate_fixture.py

      - name: Execute end-to-end notebook
        run: |
          cd notebooks
          jupyter nbconvert --to notebook --execute --inplace spark_asammdf_workflow.ipynb

      - name: Verify generated Plotly assets
        run: |
          test -d docs/assets/spark-asammdf
          test -n "$(find docs/assets/spark-asammdf -maxdepth 1 -type f -name '*.png' -print -quit)"
