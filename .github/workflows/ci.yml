name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scala-tests:
    name: Scala build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: sbt formatting check
        run: sbt scalafmtCheckAll

      - name: sbt test & package
        run: sbt test package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: spark-asammdf-jar
          path: target/scala-2.13/spark-asammdf-scala_2.13-0.1.jar

  python-tests:
    name: Python tests
    needs: scala-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: spark-asammdf-jar
          path: target/scala-2.13/

      - name: Install Python dependencies
        run: pip install -e .

      - name: Generate synthetic test fixture
        run: python src/test/resources/generate_fixture.py

      - name: Run Python test suite
        run: python -m pytest src/test/python -v
